    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" error
      try {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
        if (desc && !desc.set) {
          Object.defineProperty(window, 'fetch', {
            get: desc.get,
            set: function(val) {
              console.warn('Ignored attempt to reassign window.fetch');
            },
            configurable: true
          });
        }
      } catch (e) {
        console.error(e);
      }
    </script>
