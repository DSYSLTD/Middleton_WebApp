      (function() {
        try {
          var nativeFetch = null;
          if (typeof window.fetch === 'function') {
            nativeFetch = window.fetch;
          } else if (typeof Window !== 'undefined' && Window.prototype) {

          var activeFetch = (typeof nativeFetch === 'function')
            ? function() { return nativeFetch.apply(window, arguments); }
            : function() { return Promise.reject(new Error('Fetch API is not available')); };

          function defineSafeFetch(obj) {
            if (!obj) return;
            try {
              Object.defineProperty(obj, 'fetch', {
